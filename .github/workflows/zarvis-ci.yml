name: ZARVIS Core CI

on:
  push:
    branches: ["feat/zarvis-assistant-mvp"]
    paths: ["zarvis/**", ".github/workflows/zarvis-ci.yml"]
  pull_request:
    paths: ["zarvis/**", ".github/workflows/zarvis-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zarvis-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ZARVIS and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "zarvis[dev]"
      - name: Run tests
        run: pytest -q zarvis/tests
