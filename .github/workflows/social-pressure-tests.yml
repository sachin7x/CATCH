name: Social-pressure verifier and trial-harness tests

on:
  pull_request:
    paths:
      - 'experiments/social_pressure/**'
      - '.github/workflows/social-pressure-tests.yml'
  push:
    branches:
      - 'experiment/social-pressure-robustness'
      - 'experiment/paired-social-pressure-trials'
    paths:
      - 'experiments/social_pressure/**'
      - '.github/workflows/social-pressure-tests.yml'

jobs:
  verifier-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s experiments/social_pressure -p 'test_*.py' -v
      - name: Fixture contract
        run: python experiments/social_pressure/run_fixtures.py
      - name: Compile trial runner and analysis
        run: python -m py_compile experiments/social_pressure/run_trials.py experiments/social_pressure/analyze_trials.py
