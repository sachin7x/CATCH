name: macOS Nix

on:
  push:
    branches:
      - feat/mac-nix-bootstrap
  pull_request:
    paths:
      - "mac/**"
      - ".github/workflows/macos-nix.yml"

jobs:
  flake-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check macOS flake
        run: nix flake check ./mac
      - name: Evaluate development shell
        run: nix develop ./mac --command bash -lc 'git --version && uv --version && ruff --version'
