[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zarvis-assistant-core"
version = "0.1.0"
description = "Verifier-first ZARVIS assistant control-plane prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools]
py-modules = ["zarvis_app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zarvis_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
